resolver 127.0.0.11 valid=5s ipv6=off;

upstream persons_id {
    zone persons_id 64k;
    server id-web:3000 resolve;
}

upstream persons_admin {
    zone persons_admin 64k;
    server person-admin-web:3000 resolve;
}

upstream persons_main {
    zone persons_main 64k;
    server person-web:3000 resolve;
}

server {
    listen 8080;
    client_max_body_size 1m;
    location / {
        proxy_pass http://persons_id;
        include /etc/nginx/persons-proxy.conf;
    }
}

server {
    listen 8081;
    client_max_body_size 545m;
    location / {
        proxy_pass http://persons_admin;
        include /etc/nginx/persons-proxy.conf;
    }
}

server {
    listen 8082;
    client_max_body_size 545m;
    location / {
        proxy_pass http://persons_main;
        include /etc/nginx/persons-proxy.conf;
    }
}
