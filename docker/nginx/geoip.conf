# http context; requires the loaded ngx_http_geoip2_module and a DB-IP Lite MMDB.
# Data: https://db-ip.com (CC BY 4.0). The sessions dialog includes attribution.
geoip2 /opt/persons/shared/geoip/dbip-city-lite.mmdb {
    auto_reload 1h;
    $persons_geo_city city names en;
    $persons_geo_country country names en;
    $persons_geo_country_code country iso_code;
}

map $persons_geo_city $persons_geo_location {
    "" $persons_geo_country;
    default "$persons_geo_city, $persons_geo_country";
}

# HTTP metadata stays ASCII; unusual city names fall back to the country code.
map $persons_geo_location $persons_client_region {
    ~^[\x20-\x7e]+$ $persons_geo_location;
    default $persons_geo_country_code;
}
