# Add after compose.production.yaml. The bucket remains private except assets/*.
services:
  minio:
    profiles: [local-storage]
  minio-init:
    depends_on: !reset {}
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:?External S3 endpoint is required}
      S3_REGION: ${S3_REGION:?External S3 region is required}
      S3_BUCKET: ${S3_BUCKET:?External S3 bucket is required}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?External S3 access key is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?External S3 secret key is required}
  id:
    environment: &external-s3
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
  person:
    environment: *external-s3
  person-worker:
    environment: *external-s3
  id-web:
    environment:
      ASSET_BASE_URL: ${ASSET_BASE_URL:?External asset URL is required}
  person-web:
    environment:
      ASSET_BASE_URL: ${ASSET_BASE_URL}
  person-admin-web:
    environment:
      ASSET_BASE_URL: ${ASSET_BASE_URL}
