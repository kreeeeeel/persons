OAuthComplete:
  type: object
  required:
  - browserBinding
  - state
  - code
  properties:
    browserBinding:
      type: string
      minLength: 43
      maxLength: 128
      pattern: ^[A-Za-z0-9_-]+$
    state:
      type: string
      minLength: 43
      maxLength: 128
    code:
      type: string
      minLength: 1
      maxLength: 1024
