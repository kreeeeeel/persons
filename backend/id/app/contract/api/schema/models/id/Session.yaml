Session:
  type: object
  required:
  - id
  - createdAt
  - lastSeenAt
  - expiresAt
  - ip
  - userAgent
  - os
  - osVersion
  - browser
  - device
  - origin
  - current
  - region
  properties:
    id:
      type: string
      format: uuid
    createdAt:
      type: string
      format: date-time
    lastSeenAt:
      type: string
      format: date-time
    expiresAt:
      type: string
      format: date-time
    ip:
      type: string
    userAgent:
      type: string
    os:
      type: string
    osVersion:
      type: string
    browser:
      type: string
    device:
      type: string
    origin:
      type: string
    current:
      type: boolean
    region:
      type: string
      description: Trusted geographic description when supplied by the gateway; empty when unavailable.

