User:
  type: object
  required:
  - id
  - firstName
  - lastName
  - email
  - locale
  - hasAvatar
  - role
  properties:
    id:
      type: string
      format: uuid
    firstName:
      type: string
    lastName:
      type: string
    patronymic:
      type: string
    email:
      type: string
      format: email
    locale:
      type: string
    hasAvatar:
      type: boolean
    role:
      $ref: ./AccountRole.yaml#/AccountRole
