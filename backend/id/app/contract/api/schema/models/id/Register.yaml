Register:
  type: object
  required:
  - firstName
  - lastName
  - email
  - locale
  properties:
    firstName:
      type: string
      minLength: 1
      maxLength: 10
    lastName:
      type: string
      minLength: 1
      maxLength: 10
    patronymic:
      type: string
      maxLength: 10
    email:
      type: string
      format: email
      maxLength: 254
    locale:
      $ref: ../common/LanguageCode.yaml#/LanguageCode
