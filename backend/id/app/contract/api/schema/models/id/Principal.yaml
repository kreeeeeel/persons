Principal:
  type: object
  required:
  - userId
  - sessionId
  - email
  - locale
  - expiresAt
  - role
  properties:
    userId:
      type: string
      format: uuid
    sessionId:
      type: string
      format: uuid
    email:
      type: string
    locale:
      type: string
    expiresAt:
      type: string
      format: date-time
    role:
      $ref: ./AccountRole.yaml#/AccountRole
