/internal/v1/users/{userId}/avatar:
  get:
    tags: [id]
    operationId: getUserAvatar
    description: Trusted services must verify their domain membership before requesting another user's avatar.
    security:
    - serviceJwt: []
    parameters:
    - name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    responses:
      '200':
        description: Avatar
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
      '401':
        description: Trusted service required
      '404':
        description: Avatar absent
/internal/v1/users/profiles:
  post:
    tags: [id]
    operationId: getUserProfiles
    description: Current public author details for trusted services. Does not expose email, access rights or sessions.
    security:
    - serviceJwt: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items:
              type: string
              format: uuid
    responses:
      '200':
        description: Current profiles of existing accounts
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ./models/id/UserProfile.yaml#/UserProfile
      '400':
        description: Invalid account IDs
      '401':
        description: Trusted service required
