/account/v1/profile:
  put:
    tags: [id]
    operationId: changeProfile
    security:
    - session: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./models/id/ChangeProfile.yaml#/ChangeProfile
    responses:
      '204':
        description: Account name updated.
      '400':
        description: Invalid name
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
      '401':
        description: Session required
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
