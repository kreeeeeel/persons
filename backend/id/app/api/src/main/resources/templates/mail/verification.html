<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${locale}" lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title th:text="${title}">Персонажи</title>
    </head>
    <body style="
        margin: 0;
        padding: 40px 16px;
        background-color: #fbf8f2;
        font-family: 'Golos Text', Arial, sans-serif;
        color: #292035;
    ">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
            <tr>
                <td align="center">
                    <table role="presentation" width="520" cellspacing="0" cellpadding="0" style="
                        max-width: 100%;
                        background-color: #ffffff;
                        border-radius: 24px;
                    ">
                        <tr>
                            <td style="
                                padding: 44px 40px 20px;
                                text-align: center;
                            ">
                                <div style="
                                    color: #713be8;
                                    font-size: 36px;
                                    font-weight: bold;
                                    letter-spacing: -2px;
                                ">Персонажи</div>
                            </td>
                        </tr>
                        <tr>
                            <td style="
                                padding: 12px 40px 32px;
                                text-align: center;
                            ">
                                <h1 th:text="${title}" style="
                                    margin: 0 0 16px;
                                    font-size: 26px;
                                    font-weight: 600;
                                    line-height: 1.3;
                                "></h1>
                                <p th:text="${text}" style="
                                    margin: 0;
                                    color: #756a80;
                                    line-height: 1.7;
                                    font-size: 16px;
                                "></p>
                            </td>
                        </tr>
                        <tr>
                            <td style="
                                padding: 0 40px 32px;
                                text-align: center;
                            ">
                                <p th:text="${copy.codeLabel}" style="
                                    font-size: 16px;
                                    color: #756a80;
                                "></p>
                                <strong th:text="${code}" style="
                                    display: block;
                                    padding: 24px 12px;
                                    border-radius: 16px;
                                    background-color: #eee5ff;
                                    color: #713be8;
                                    font-size: 36px;
                                    letter-spacing: 10px;
                                    font-family: monospace;
                                "></strong>
                                <p th:text="${copy.expiry}" style="
                                    font-size: 16px;
                                    line-height: 1.7;
                                    color: #756a80;
                                "></p>
                            </td>
                        </tr>
                        <tr>
                            <td style="
                                padding: 0 40px 36px;
                                text-align: center;
                            ">
                                <p th:text="${copy.ignore}" style="
                                    font-size: 16px;
                                    line-height: 1.7;
                                    color: #82768e;
                                "></p>
                            </td>
                        </tr>
                    </table>
                    <p th:text="${copy.footer}" style="
                        padding: 12px;
                        color: #82768e;
                        font-size: 16px;
                    "></p>
                </td>
            </tr>
        </table>
    </body>
</html>
