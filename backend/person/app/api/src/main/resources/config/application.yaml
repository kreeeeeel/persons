server:
  port: 8085
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: persons-person
  profiles:
    default: dev
  config:
    import:
      - classpath:persons-id-client.yaml
      - classpath:persons-restrictions-client.yaml
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 512MB
      max-request-size: 545MB
      file-size-threshold: 0
project:
  gateway:
    jwt-secret: ${PROJECT_GATEWAY_JWT_SECRET}
  internal:
    jwt-secret: ${PROJECT_INTERNAL_JWT_SECRET}
  observability:
    bodies-enabled: false
    masked-headers:
    - x-service-authorization
    - x-gateway-authorization
s3:
  endpoint: ${S3_ENDPOINT}
  region: ${S3_REGION}
  bucket: ${S3_BUCKET}
  object-prefix: person-media
  credentials:
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
springdoc:
  enable-default-api-docs: false
  swagger-ui:
    url: /openapi/api.yaml
management:
  endpoints:
    web:
      exposure:
        include: health,info
