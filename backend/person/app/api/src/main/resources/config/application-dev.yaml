spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:54320/person}
    username: ${DB_USER:persons}
    password: ${DB_PASSWORD:persons-local}
project:
  gateway:
    jwt-secret: ${PROJECT_GATEWAY_JWT_SECRET:local-development-gateway-jwt-secret-change-before-deploy}
  internal:
    jwt-secret: ${PROJECT_INTERNAL_JWT_SECRET:local-development-internal-jwt-secret-change-before-deploy}
s3:
  endpoint: ${S3_ENDPOINT:http://localhost:9000}
  region: ${S3_REGION:us-east-1}
  bucket: ${S3_BUCKET:persons}
  credentials:
    access-key: ${S3_ACCESS_KEY:persons}
    secret-key: ${S3_SECRET_KEY:persons-local}
