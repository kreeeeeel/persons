/v1/media/{id}/content:
  get:
    tags:
      - media
    operationId: readMedia
    summary: readMedia
    responses:
      '200':
        description: Media content
        headers:
          Accept-Ranges:
            schema:
              type: string
          Content-Range:
            schema:
              type: string
          Content-Length:
            schema:
              type: integer
              format: int64
          Content-Type:
            schema:
              type: string
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      '206':
        description: Media content
        headers:
          Accept-Ranges:
            schema:
              type: string
          Content-Range:
            schema:
              type: string
          Content-Length:
            schema:
              type: integer
              format: int64
          Content-Type:
            schema:
              type: string
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      '400':
        description: Request failed
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
      '403':
        description: Access denied or account action restricted
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
      '404':
        description: Request failed
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
      '416':
        description: Requested byte range is not satisfiable
      '503':
        description: Request failed
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Range
        in: header
        schema:
          type: string
          maxLength: 100
