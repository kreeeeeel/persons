/v1/persons/{id}/media:
  post:
    tags:
      - media
    operationId: uploadMedia
    summary: uploadMedia
    responses:
      '202':
        description: Success
        content:
          application/json:
            schema:
              $ref: ./models/moderation/ModerationReceipt.yaml#/ModerationReceipt
      '400':
        description: Request failed
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
      '401':
        description: Request failed
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
      '403':
        description: Access denied or account action restricted
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
      '404':
        description: Request failed
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
      '409':
        description: Request failed
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
      '413':
        description: Request failed
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
      '415':
        description: Request failed
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
      '429':
        description: Request failed
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
      '503':
        description: Request failed
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    security:
      - session: []
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - file
              - kind
            properties:
              file:
                type: string
                format: binary
                description: Videos up to 512 MiB, photos up to 32 MiB, avatars up to 2 MiB.
              kind:
                $ref: ./models/media/MediaKind.yaml#/MediaKind
              caption:
                type: string
                maxLength: 200
              durationSeconds:
                type: number
                format: double
                minimum: 0
                maximum: 86400
              preview:
                type: string
                format: binary
              taggedPersonIds:
                type: array
                items:
                  type: string
                  format: uuid
                maxItems: 20
