/v1/admin/persons/{id}/reputation:
  put:
    tags:
      - reputation-admin
    operationId: setReputationOverride
    summary: setReputationOverride
    responses:
      '200':
        description: Updated profile
        content:
          application/json:
            schema:
              $ref: ./models/person/PersonProfile.yaml#/PersonProfile
      '400':
        description: Request failed
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
      '401':
        description: Request failed
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
      '403':
        description: Access denied or account action restricted
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
      '404':
        description: Request failed
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
      '409':
        description: Request failed
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
      '429':
        description: Request failed
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
      '503':
        description: Request failed
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./models/person/ReputationOverrideInput.yaml#/ReputationOverrideInput
    security:
      - session: []
