/v1/admin/content:
  get:
    tags: [content-admin]
    operationId: listAdminContent
    summary: Search all current and hidden content with its destination page
    security:
      - session: []
    parameters:
      - name: page
        in: query
        schema: {type: integer, minimum: 0, maximum: 10000, default: 0}
      - name: size
        in: query
        schema: {type: integer, minimum: 1, maximum: 50, default: 20}
      - name: kind
        in: query
        schema:
          $ref: ./models/content/AdminContentKind.yaml#/AdminContentKind
      - name: status
        in: query
        schema:
          $ref: ./models/content/AdminContentStatus.yaml#/AdminContentStatus
      - name: q
        in: query
        schema: {type: string, maxLength: 200}
      - name: authorId
        in: query
        schema: {type: string, format: uuid}
      - name: personId
        in: query
        schema: {type: string, format: uuid}
      - name: createdFrom
        in: query
        schema: {type: string, format: date-time}
      - name: createdTo
        in: query
        description: Exclusive upper time boundary
        schema: {type: string, format: date-time}
      - name: order
        in: query
        schema:
          $ref: ./models/content/AdminContentOrder.yaml#/AdminContentOrder
          default: NEWEST
    responses:
      '200':
        description: Content and statistics matching the filters
        content:
          application/json:
            schema:
              $ref: ./models/content/AdminContentPage.yaml#/AdminContentPage
      '401':
        description: Authentication required
      '403':
        description: Administrator access required
      '400':
        description: Invalid filters or input
/v1/admin/content/{kind}/{id}/hide:
  post:
    tags: [content-admin]
    operationId: hideAdminContent
    summary: Remove a publication and reject its pending changes with an audit reason
    security:
      - session: []
    parameters:
      - name: kind
        in: path
        required: true
        schema:
          $ref: ./models/content/AdminContentKind.yaml#/AdminContentKind
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./models/content/ContentHideInput.yaml#/ContentHideInput
    responses:
      '204':
        description: Publication removed and pending changes rejected
      '404':
        description: Content not found
      '409':
        description: Content is already hidden or is an incomplete upload
      '401':
        description: Authentication required
      '403':
        description: Administrator access required
      '400':
        description: Invalid filters or input
