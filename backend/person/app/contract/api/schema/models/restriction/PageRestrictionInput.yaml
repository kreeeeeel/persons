PageRestrictionInput:
  type: object
  required: [personId, scopes, reason]
  properties:
    personId: {type: string, format: uuid}
    scopes:
      type: array
      minItems: 1
      maxItems: 6
      uniqueItems: true
      items:
        $ref: ./PageRestrictionScope.yaml#/PageRestrictionScope
    reason: {type: string, minLength: 3, maxLength: 1000}
    expiresAt: {type: string, format: date-time}
