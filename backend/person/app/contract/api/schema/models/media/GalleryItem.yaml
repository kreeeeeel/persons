GalleryItem:
  type: object
  required: [id, mediaId, kind, title, createdAt, canRemove, views, durationSeconds, previewAvailable]
  properties:
    id:
      type: string
      format: uuid
    mediaId:
      type: string
      format: uuid
    kind:
      $ref: ./MediaKind.yaml#/MediaKind
    title:
      type: string
      maxLength: 200
    createdAt:
      type: string
      format: date-time
    canRemove:
      type: boolean
    views:
      type: integer
      format: int64
      minimum: 0
    durationSeconds:
      type: number
      format: double
      minimum: 0
    previewAvailable:
      type: boolean
    moderationStatus:
      $ref: ../moderation/ModerationStatus.yaml#/ModerationStatus
