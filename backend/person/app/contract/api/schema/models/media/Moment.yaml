Moment:
  type: object
  required:
    - id
    - mediaId
    - title
    - authorName
    - createdAt
    - likes
    - liked
    - comments
    - canRemove
  properties:
    id:
      type: string
      format: uuid
    mediaId:
      type: string
      format: uuid
    title:
      type: string
      maxLength: 200
    authorName:
      type: string
      maxLength: 250
    createdAt:
      type: string
      format: date-time
    likes:
      type: integer
      format: int64
      minimum: 0
    liked:
      type: boolean
    comments:
      type: integer
      format: int64
      minimum: 0
    canRemove:
      type: boolean
    durationSeconds:
      type: number
      format: double
      minimum: 0
    previewAvailable:
      type: boolean
    views:
      type: integer
      format: int64
      minimum: 0
    moderationStatus:
      $ref: ../moderation/ModerationStatus.yaml#/ModerationStatus
