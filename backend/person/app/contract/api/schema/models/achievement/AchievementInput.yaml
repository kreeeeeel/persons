AchievementInput:
  type: object
  required:
    - title
    - description
    - active
    - version
  properties:
    title:
      type: string
      maxLength: 100
      minLength: 1
    description:
      type: string
      maxLength: 1000
    active:
      type: boolean
    version:
      type: integer
      format: int64
      minimum: 0
    type:
      $ref: ./AchievementType.yaml#/AchievementType
    pageAgeYears:
      type: integer
      minimum: 1
      maximum: 5
      description: Required for AUTOMATIC achievements; omitted for MANUAL achievements.
