ModerationPage:
  type: object
  required:
    - items
    - total
    - page
    - size
  properties:
    items:
      type: array
      items:
        $ref: ../moderation/ModerationItem.yaml#/ModerationItem
    total:
      type: integer
      format: int64
      minimum: 0
    page:
      type: integer
      minimum: 0
    size:
      type: integer
      minimum: 1
    statistics:
      description: Counts matching all filters except status, across the complete result set
      $ref: ../moderation/ModerationStatistics.yaml#/ModerationStatistics
