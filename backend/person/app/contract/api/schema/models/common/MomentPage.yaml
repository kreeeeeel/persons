MomentPage:
  type: object
  required:
    - items
    - total
    - page
    - size
  properties:
    items:
      type: array
      items:
        $ref: ../media/Moment.yaml#/Moment
    total:
      type: integer
      format: int64
      minimum: 0
    page:
      type: integer
      minimum: 0
    size:
      type: integer
      minimum: 1
