AchievementPage:
  type: object
  required:
    - items
    - total
    - page
    - size
  properties:
    items:
      type: array
      items:
        $ref: ../achievement/Achievement.yaml#/Achievement
    total:
      type: integer
      format: int64
      minimum: 0
    page:
      type: integer
    size:
      type: integer
