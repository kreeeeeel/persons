DotaItem:
  type: "object"
  required:
    - "id"
    - "name"
    - "imageUrl"
  properties:
    id:
      type: "string"
    name:
      type: "string"
    imageUrl:
      type: "string"
      format: "uri"
    acquiredAtSeconds:
      type: "integer"
      minimum: 0
      description: "Match clock when this item was acquired, omitted when unknown."
