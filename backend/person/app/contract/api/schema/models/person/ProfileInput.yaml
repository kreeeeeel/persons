ProfileInput:
  type: object
  required:
    - tag
    - firstName
    - lastName
    - description
    - tags
    - socialLinks
    - ratingOptions
    - version
  properties:
    presence:
      $ref: ./PersonPresence.yaml#/PersonPresence
    dates:
      description: Omitted preserves stored dates; an empty object clears them.
      allOf:
        - $ref: ./PersonDates.yaml#/PersonDates
    tag:
      type: string
      maxLength: 32
      minLength: 2
      pattern: ^[a-z][a-z0-9-]{1,31}$
    firstName:
      type: string
      maxLength: 10
      minLength: 1
    lastName:
      type: string
      maxLength: 10
    patronymic:
      type: string
      maxLength: 10
    description:
      type: string
      maxLength: 3000
    tags:
      type: array
      items:
        type: string
        maxLength: 32
        minLength: 1
      maxItems: 12
    searchKeywords:
      type: array
      nullable: true
      description: Additional search names. Omitted or null preserves existing keywords on update; an empty list clears them.
      maxItems: 20
      items:
        type: string
        minLength: 1
        maxLength: 80
    socialLinks:
      type: array
      items:
        $ref: ../person/SocialLink.yaml#/SocialLink
      maxItems: 3
    ratingOptions:
      type: array
      items:
        $ref: ../person/RatingOptionInput.yaml#/RatingOptionInput
      maxItems: 12
      minItems: 1
    version:
      type: integer
      format: int64
      minimum: 0
