RatingState:
  type: object
  required:
    - options
  properties:
    calculationPending:
      type: boolean
      description: True while the worker is recalculating aggregate totals; the individual vote is saved immediately.
    options:
      type: array
      items:
        $ref: ../person/RatingOption.yaml#/RatingOption
    average:
      type: number
      format: double
    total:
      type: integer
      format: int64
      minimum: 0
    value:
      type: integer
      minimum: 1
      maximum: 5
    optionId:
      type: string
      format: uuid
    emoji:
      type: string
    availableEmojis:
      type: array
      items:
        type: string
    comment:
      type: string
      maxLength: 1000
    commentStatus:
      $ref: ../moderation/ModerationStatus.yaml#/ModerationStatus
