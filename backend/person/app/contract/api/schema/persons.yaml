/v1/persons/recommendations:
  get:
    tags: [persons]
    operationId: recommendPersons
    description: Random published pages, excluding pages owned by the current account. A fresh sample is returned on every request.
    parameters:
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 6
          default: 5
    responses:
      '200':
        description: Random page recommendations
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ./models/person/PersonSummary.yaml#/PersonSummary
      '400':
        description: Invalid size
/v1/persons/search:
  get:
    tags:
      - persons
    operationId: searchPersons
    summary: searchPersons
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              $ref: ./models/common/PersonSearchPage.yaml#/PersonSearchPage
      '400':
        description: Request failed
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
      '403':
        description: Access denied or account action restricted
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
      '404':
        description: Request failed
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
      '503':
        description: Request failed
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
    parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          maxLength: 120
          minLength: 2
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 12
/v1/persons/by-tag/{tag}:
  get:
    tags:
      - persons
    operationId: getPerson
    summary: getPerson
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              $ref: ./models/person/PersonProfile.yaml#/PersonProfile
      '400':
        description: Request failed
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
      '403':
        description: Access denied or account action restricted
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
      '404':
        description: Request failed
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
      '503':
        description: Request failed
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
    parameters:
      - name: tag
        in: path
        required: true
        schema:
          type: string
          maxLength: 32
          pattern: ^[a-z][a-z0-9-]{1,31}$
