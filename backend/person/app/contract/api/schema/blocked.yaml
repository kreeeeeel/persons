/v1/admin/blocked-users:
  get:
    tags: [restrictions]
    operationId: listBlockedUsers
    security:
      - session: []
    parameters:
      - {name: page, in: query, schema: {type: integer, minimum: 0, maximum: 10000, default: 0}}
      - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      - {name: q, in: query, schema: {type: string, maxLength: 200}}
      - {name: userId, in: query, schema: {type: string, format: uuid}}
    responses:
      '200':
        description: Active restrictions ordered newest first
        content:
          application/json:
            schema:
              $ref: ./models/restriction/AccountRestrictionPage.yaml#/AccountRestrictionPage
      '403':
        description: Administrator access required

/v1/admin/page-restrictions:
  get:
    tags: [page-restrictions]
    operationId: listActivePageRestrictions
    security:
      - session: []
    parameters:
      - {name: page, in: query, schema: {type: integer, minimum: 0, maximum: 10000, default: 0}}
      - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      - {name: q, in: query, schema: {type: string, maxLength: 200}}
      - {name: userId, in: query, schema: {type: string, format: uuid}}
    responses:
      '200':
        description: Active restrictions ordered newest first
        content:
          application/json:
            schema:
              $ref: ./models/restriction/PageRestrictionPage.yaml#/PageRestrictionPage
      '403':
        description: Administrator access required
