  post:
    tags:
      - achievements
    operationId: createAchievement
    summary: createAchievement
    parameters: []
    security:
      - session: []
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - title
              - description
              - file
            properties:
              title:
                type: string
                minLength: 1
                maxLength: 100
              description:
                type: string
                maxLength: 1000
              file:
                type: string
                format: binary
              type:
                allOf:
                  - $ref: ./models/achievement/AchievementType.yaml#/AchievementType
                default: MANUAL
              active:
                type: boolean
                description: Available to grant by default when omitted.
              pageAgeYears:
                type: integer
                minimum: 1
                maximum: 5
    responses:
      '201':
        description: Success
        content:
          application/json:
            schema:
              $ref: ./models/achievement/Achievement.yaml#/Achievement
