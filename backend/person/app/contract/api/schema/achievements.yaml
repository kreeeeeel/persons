    tags:
      - achievements
    operationId: listAchievements
    summary: listAchievements
    parameters:
      - {name: q, in: query, schema: {type: string, maxLength: 200}}
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 12
    security:
      - session: []
    responses:
      '200':
        description: Success
