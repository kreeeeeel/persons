      - interactions
    operationId: listComments
    summary: listComments
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              $ref: ./models/common/CommentPage.yaml#/CommentPage
      '400':
        description: Request failed
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
      '403':
        description: Access denied or account action restricted
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
      '404':
        description: Request failed
        content:
          application/json:
