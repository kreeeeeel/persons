      '503':
        description: Request failed
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
    parameters:
      - name: mine
        in: query
        description: Return only entries authored by the authenticated user, including their pending entries.
        schema:
          type: boolean
          default: false
      - name: sort
        in: query
        schema:
