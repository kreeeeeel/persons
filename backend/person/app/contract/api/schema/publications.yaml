/v1/publications/mine:
  get:
    tags: [publications]
    operationId: listMyPublications
    description: Current publications authored by the authenticated account, including pending moderation. Search matches destination page names and tags. Deleted content, drafts and inaccessible pages are excluded.
    security:
      - session: []
        serviceJwt: []
    parameters:
      - name: kind
        in: query
        schema:
          $ref: ./models/publication/PublicationKind.yaml#/PublicationKind
      - name: q
        in: query
        schema:
          type: string
          maxLength: 120
      - name: page
        in: query
        schema:
          type: integer
          default: 0
          minimum: 0
          maximum: 1000000
      - name: size
        in: query
        schema:
          type: integer
          default: 12
          minimum: 1
          maximum: 60
    responses:
      '200':
        description: Newest first, with deterministic ordering for equal timestamps.
        content:
          application/json:
            schema:
              $ref: ./models/publication/MyPublicationPage.yaml#/MyPublicationPage
      '400':
        description: Invalid filters or pagination
      '401':
        description: Authentication required
