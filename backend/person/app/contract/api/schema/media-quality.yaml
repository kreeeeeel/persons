/v1/media/{id}/qualities:
  get:
    tags:
      - media-quality
    operationId: listMediaQualities
    summary: listMediaQualities
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              $ref: ./models/media/MediaQualityList.yaml#/MediaQualityList
      '400':
        description: Request failed
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
      '403':
        description: Access denied or account action restricted
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
      '404':
        description: Request failed
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
      '503':
        description: Request failed
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
/v1/media/{id}/qualities/{height}/content:
  get:
    tags:
      - media-quality
    operationId: readMediaQuality
    summary: readMediaQuality
    responses:
      '200':
        description: Media content
        headers:
          Accept-Ranges:
            schema:
              type: string
          Content-Range:
            schema:
              type: string
          Content-Length:
            schema:
              type: integer
              format: int64
          Content-Type:
            schema:
              type: string
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      '206':
        description: Media content
        headers:
          Accept-Ranges:
            schema:
              type: string
          Content-Range:
            schema:
              type: string
          Content-Length:
            schema:
              type: integer
              format: int64
          Content-Type:
            schema:
              type: string
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      '400':
        description: Request failed
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
      '403':
        description: Access denied or account action restricted
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
      '404':
        description: Request failed
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
      '416':
        description: Requested byte range is not satisfiable
      '503':
        description: Request failed
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: height
        in: path
        required: true
        schema:
          type: integer
          minimum: 2
          maximum: 1080
      - name: Range
        in: header
        schema:
          type: string
          maxLength: 100
