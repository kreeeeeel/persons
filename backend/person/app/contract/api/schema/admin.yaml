    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              $ref: ./models/common/ModerationPage.yaml#/ModerationPage
      '400':
        description: Request failed
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
      '401':
        description: Request failed
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
      '403':
        description: Access denied or account action restricted
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
      '404':
        description: Request failed
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
      '409':
        description: Request failed
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
      '503':
        description: Request failed
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
    parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 12
      - name: status
        in: query
        schema:
          $ref: ./models/moderation/ModerationFilterStatus.yaml#/ModerationFilterStatus
          default: PENDING
      - name: type
        in: query
        schema:
          $ref: ./models/moderation/ModerationContentType.yaml#/ModerationContentType
      - name: q
        in: query
        description: Search author, destination page or proposed content
        schema: {type: string, maxLength: 200}
      - name: authorId
        in: query
        schema: {type: string, format: uuid}
      - name: personId
        in: query
        schema: {type: string, format: uuid}
      - name: createdFrom
        in: query
        description: Inclusive submission time
        schema: {type: string, format: date-time}
      - name: createdTo
        in: query
        description: Exclusive submission time
        schema: {type: string, format: date-time}
      - name: order
        in: query
        schema:
          $ref: ./models/moderation/ModerationOrder.yaml#/ModerationOrder
          default: OLDEST
    security:
      - session: []
