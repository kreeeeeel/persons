/v1/admin/users/{id}/avatar:
  get:
    tags: [accounts]
    operationId: getAdminUserAvatar
    summary: Read an account avatar as an administrator
    security: [{session: []}]
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Current account avatar
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
      '401':
        $ref: ./publication.yaml#/Unauthorized
      '403':
        $ref: ./publication.yaml#/Forbidden
      '404':
        description: Account avatar is absent
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
