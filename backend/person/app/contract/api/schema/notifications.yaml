/v1/notifications:
  get:
    tags:
      - notifications
    operationId: listNotifications
    summary: listNotifications
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              $ref: ./models/common/NotificationPage.yaml#/NotificationPage
      '400':
        description: Request failed
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
      '401':
        description: Request failed
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
      '403':
        description: Access denied or account action restricted
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
      '404':
        description: Request failed
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
      '409':
        description: Request failed
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
      '503':
        description: Request failed
        content:
          application/json:
            schema:
              $ref: ./models/common/ClientErrorResponse.yaml#/ClientErrorResponse
    parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 12
    security:
      - session: []
