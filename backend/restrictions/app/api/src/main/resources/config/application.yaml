server:
  port: 8088
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: persons-restrictions
  profiles:
    default: dev
  config:
    import: classpath:persons-id-client.yaml
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      connect-timeout: 500ms
      timeout: 500ms
project:
  internal:
    jwt-secret: ${PROJECT_INTERNAL_JWT_SECRET}
  restriction-cache:
    ttl: 30s
  observability:
    bodies-enabled: false
    masked-headers:
      - x-service-authorization
management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      enabled: false
