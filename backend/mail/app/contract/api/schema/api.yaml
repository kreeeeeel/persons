openapi: 3.0.3
info:
  title: Persons Mail API
  version: 0.1.0
servers:
- url: /
paths:
  /internal/v1/messages:
    $ref: ./mail.yaml#/~1internal~1v1~1messages
components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Signed JWT backed by a revocable session. Browsers use a same-origin BFF and HttpOnly cookie.
    serviceJwt:
      type: apiKey
      in: header
      name: X-Service-Authorization
