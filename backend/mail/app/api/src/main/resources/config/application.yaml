server:
  port: 8083
  forward-headers-strategy: none
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: persons-mail
  profiles:
    default: dev
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${SMTP_STARTTLS_REQUIRED:${SMTP_STARTTLS:true}}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  enable-default-api-docs: false
  swagger-ui:
    url: /openapi/api.yaml
project:
  observability:
    bodies-enabled: ${PROJECT_LOG_BODIES:false}
    max-body-bytes: 65536
    masked-fields:
    - email
    - recipient
    - html
    - avatarBase64
    masked-headers:
    - x-service-authorization
  mail:
    from: ${MAIL_FROM}
    max-attempts: 5
  internal:
    jwt-secret: ${PROJECT_INTERNAL_JWT_SECRET}
