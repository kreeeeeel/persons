name: persons
services:
  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_USER: persons
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run scripts/setup.ps1}
      POSTGRES_DB: id
    ports:
      - 127.0.0.1:54320:5432
    volumes:
      - postgres:/var/lib/postgresql
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U persons -d id
      interval: 5s
      timeout: 5s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - 127.0.0.1:8025:8025
      - 127.0.0.1:1025:1025
  minio:
    build:
      context: .
      dockerfile: docker/minio/Dockerfile.server
    image: persons-minio:local
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run scripts/setup.ps1}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run scripts/setup.ps1}
    ports:
      - 127.0.0.1:9000:9000
      - 127.0.0.1:9001:9001
    volumes:
      - minio:/data
    healthcheck:
      test:
        - CMD
        - curl
        - '-f'
        - http://localhost:9000/minio/health/live
      interval: 5s
      timeout: 5s
      retries: 20
  minio-init:
    build:
      context: .
      dockerfile: docker/minio/Dockerfile
      target: client
    image: persons-minio-client:local
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint:
      - /bin/sh
      - /initialize.sh
    volumes:
      - ./docker/minio/initialize.sh:/initialize.sh:ro
      - ./docker/minio/public-assets.json:/policy.json:ro
      - ./frontend/assets:/assets:ro
      - ./frontend/libs/i18n/assets/flags:/flags:ro
  i18n:
    build:
      context: .
      dockerfile: backend/i18n/app/api/docker/Dockerfile
    image: persons-i18n:local
    environment:
      SPRING_PROFILES_ACTIVE: production
      PROJECT_INTERNAL_JWT_SECRET: ${PROJECT_INTERNAL_JWT_SECRET:?Run scripts/setup.ps1}
      DB_URL: jdbc:postgresql://postgres:5432/i18n
      DB_USER: persons
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 127.0.0.1:8082:8082
    healthcheck:
      test:
        - CMD
        - curl
        - '-fsS'
        - http://localhost:8082/actuator/health
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
  mail:
    build:
      context: .
      dockerfile: backend/mail/app/api/docker/Dockerfile
    image: persons-mail:local
    environment:
      SPRING_PROFILES_ACTIVE: production
      PROJECT_INTERNAL_JWT_SECRET: ${PROJECT_INTERNAL_JWT_SECRET:?Run scripts/setup.ps1}
      DB_URL: jdbc:postgresql://postgres:5432/mail
      DB_USER: persons
      DB_PASSWORD: ${DB_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_STARTTLS_REQUIRED: ${SMTP_STARTTLS_REQUIRED:-false}
      MAIL_FROM: ${MAIL_FROM:-Персонажи <hello@persons.local>}
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - 127.0.0.1:8083:8083
    healthcheck:
      test:
        - CMD
        - curl
        - '-fsS'
        - http://localhost:8083/actuator/health
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
  id:
    build:
      context: .
      dockerfile: backend/id/app/api/docker/Dockerfile
    image: persons-id:local
    environment:
      SPRING_PROFILES_ACTIVE: production
      PROJECT_INTERNAL_JWT_SECRET: ${PROJECT_INTERNAL_JWT_SECRET:?Run scripts/setup.ps1}
      DB_URL: jdbc:postgresql://postgres:5432/id
      DB_USER: persons
      DB_PASSWORD: ${DB_PASSWORD}
      MAIL_BASE_URL: http://mail:8083
      I18N_BASE_URL: http://i18n:8082
      ID_PEPPER: ${ID_PEPPER:?Run scripts/setup.ps1}
      ID_JWT_SECRET: ${ID_JWT_SECRET:?Run scripts/setup.ps1}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: persons
      S3_OBJECT_PREFIX: avatars
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      PERSONS_ADMIN_EMAIL: ${PERSONS_ADMIN_EMAIL:-}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      YANDEX_REDIRECT_URI: ${YANDEX_REDIRECT_URI:-http://localhost:3000/api/oauth/yandex/callback}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mail:
        condition: service_healthy
      i18n:
        condition: service_healthy
    ports:
      - 127.0.0.1:8081:8081
    healthcheck:
      test:
        - CMD
        - curl
        - '-fsS'
        - http://localhost:8081/actuator/health
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
  person:
    build:
      context: .
      dockerfile: backend/person/app/api/docker/Dockerfile
    image: persons-person:local
    environment:
      DYNAMIC_PROPERTIES_REDIS_HOST: properties-redis
      DYNAMIC_PROPERTIES_REDIS_PASSWORD: ${REDIS_PASSWORD:?Run scripts/setup.ps1}
      SPRING_PROFILES_ACTIVE: production
      PROJECT_INTERNAL_JWT_SECRET: ${PROJECT_INTERNAL_JWT_SECRET:?Run scripts/setup.ps1}
      PROJECT_GATEWAY_JWT_SECRET: ${PROJECT_GATEWAY_JWT_SECRET:?Run scripts/setup.ps1}
      DB_URL: jdbc:postgresql://postgres:5432/person
      DB_USER: persons
      DB_PASSWORD: ${DB_PASSWORD}
      ID_BASE_URL: http://id:8081
      RESTRICTIONS_BASE_URL: http://restrictions:8088
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: persons
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      properties-redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      id:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - 127.0.0.1:8085:8085
    healthcheck:
      test:
        - CMD
        - curl
        - '-fsS'
        - http://localhost:8085/actuator/health
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
  person-worker:
    build:
      context: .
      dockerfile: backend/person-worker/app/worker/docker/Dockerfile
    image: persons-person-worker:local
    environment:
      LEETIFY_API_KEY: ${LEETIFY_API_KEY:-}
      DYNAMIC_PROPERTIES_REDIS_HOST: properties-redis
      DYNAMIC_PROPERTIES_REDIS_PASSWORD: ${REDIS_PASSWORD:?Run scripts/setup.ps1}
      SPRING_PROFILES_ACTIVE: production
      PROJECT_INTERNAL_JWT_SECRET: ${PROJECT_INTERNAL_JWT_SECRET:?Run scripts/setup.ps1}
      RESTRICTIONS_BASE_URL: http://restrictions:8088
      DB_URL: jdbc:postgresql://postgres:5432/person
      DB_USER: persons
      DB_PASSWORD: ${DB_PASSWORD}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: persons
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      properties-redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      person:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      restrictions:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, '-fsS', http://localhost:8086/actuator/health]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
  properties-redis:
    image: redis:8.2.9-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run scripts/setup.ps1}
    command:
      - sh
      - -ec
      - exec redis-server --appendonly yes --appendfsync everysec --maxmemory 64mb --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"
    volumes:
      - properties-redis:/data
    ports:
      - 127.0.0.1:6380:6379
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:8.2.9-alpine
    user: redis
    read_only: true
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run scripts/setup.ps1}
    command:
      - sh
      - -ec
      - exec redis-server --save "" --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru --requirepass "$$REDIS_PASSWORD"
    mem_limit: 160m
    mem_reservation: 32m
    memswap_limit: 160m
    ports:
      - 127.0.0.1:6379:6379
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 15
  restrictions:
    build:
      context: .
      dockerfile: backend/restrictions/app/api/docker/Dockerfile
    image: persons-restrictions:local
    environment:
      SPRING_PROFILES_ACTIVE: production
      PROJECT_INTERNAL_JWT_SECRET: ${PROJECT_INTERNAL_JWT_SECRET:?Run scripts/setup.ps1}
      DB_URL: jdbc:postgresql://postgres:5432/restrictions?connectTimeout=3&socketTimeout=5
      DB_USER: persons
      DB_PASSWORD: ${DB_PASSWORD}
      ID_BASE_URL: http://id:8081
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      id:
        condition: service_healthy
    ports:
      - 127.0.0.1:8088:8088
    healthcheck:
      test: [CMD, curl, '-fsS', http://localhost:8088/actuator/health]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
  gateway:
    build:
      context: .
      dockerfile: backend/gateway/app/api/docker/Dockerfile
    image: persons-gateway:local
    environment:
      SPRING_PROFILES_ACTIVE: production
      PROJECT_INTERNAL_JWT_SECRET: ${PROJECT_INTERNAL_JWT_SECRET:?Run scripts/setup.ps1}
      PROJECT_GATEWAY_JWT_SECRET: ${PROJECT_GATEWAY_JWT_SECRET:?Run scripts/setup.ps1}
      ID_BASE_URL: http://id:8081
      PERSON_BASE_URL: http://person:8085
      RESTRICTIONS_BASE_URL: http://restrictions:8088
    depends_on:
      id:
        condition: service_healthy
      person:
        condition: service_healthy
      restrictions:
        condition: service_healthy
    ports:
      - 127.0.0.1:8087:8087
    healthcheck:
      test: [CMD, curl, '-fsS', http://localhost:8087/actuator/health]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
  id-web:
    build:
      context: .
      dockerfile: frontend/id/docker/Dockerfile
    image: persons-id-web:local
    environment:
      APP_ENV: prod
      ID_BASE_URL: http://gateway:8087/id
      I18N_BASE_URL: http://i18n:8082
      ASSET_BASE_URL: http://minio:9000/persons/assets
      PUBLIC_URL: ${PUBLIC_ID_URL:-http://localhost:3000}
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-}
      ID_PUBLIC_URL: ${PUBLIC_ID_URL:-http://localhost:3000}
      ADMIN_PUBLIC_URL: ${PUBLIC_ADMIN_URL:-http://localhost:3001}
      PERSON_PUBLIC_URL: ${PUBLIC_PERSON_URL:-http://localhost:3002}
      TRUST_PROXY: 'true'
      PROJECT_INTERNAL_JWT_SECRET: ${PROJECT_INTERNAL_JWT_SECRET:?Run scripts/setup.ps1}
    depends_on:
      gateway:
        condition: service_healthy
      id:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
  person-admin-web:
    build:
      context: .
      dockerfile: frontend/person-admin/docker/Dockerfile
    image: persons-person-admin-web:local
    environment:
      APP_ENV: prod
      ID_BASE_URL: http://gateway:8087/id
      PERSON_BASE_URL: http://gateway:8087/person
      DYNAMIC_PROPERTIES_BASE_URL: ${DYNAMIC_PROPERTIES_BASE_URL:-http://gateway:8087/person}
      I18N_BASE_URL: http://i18n:8082
      ASSET_BASE_URL: http://minio:9000/persons/assets
      PUBLIC_URL: ${PUBLIC_ADMIN_URL:-http://localhost:3001}
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-}
      ID_PUBLIC_URL: ${PUBLIC_ID_URL:-http://localhost:3000}
      ADMIN_PUBLIC_URL: ${PUBLIC_ADMIN_URL:-http://localhost:3001}
      PERSON_PUBLIC_URL: ${PUBLIC_PERSON_URL:-http://localhost:3002}
      TRUST_PROXY: 'true'
      PROJECT_INTERNAL_JWT_SECRET: ${PROJECT_INTERNAL_JWT_SECRET:?Run scripts/setup.ps1}
    depends_on:
      gateway:
        condition: service_healthy
      id:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      person:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
  person-web:
    build:
      context: .
      dockerfile: frontend/person/docker/Dockerfile
    image: persons-person-web:local
    environment:
      APP_ENV: prod
      ID_BASE_URL: http://gateway:8087/id
      PERSON_BASE_URL: http://gateway:8087/person
      DYNAMIC_PROPERTIES_BASE_URL: ${DYNAMIC_PROPERTIES_BASE_URL:-http://gateway:8087/person}
      I18N_BASE_URL: http://i18n:8082
      ASSET_BASE_URL: http://minio:9000/persons/assets
      PUBLIC_URL: ${PUBLIC_PERSON_URL:-http://localhost:3002}
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-}
      ADMIN_PUBLIC_URL: ${PUBLIC_ADMIN_URL:-http://localhost:3001}
      ID_PUBLIC_URL: ${PUBLIC_ID_URL:-http://localhost:3000}
      PROJECT_INTERNAL_JWT_SECRET: ${PROJECT_INTERNAL_JWT_SECRET:?Run scripts/setup.ps1}
      TRUST_PROXY: 'true'
    depends_on:
      gateway:
        condition: service_healthy
      id:
        condition: service_healthy
      person:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
  web-gateway:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    ports:
      - 127.0.0.1:3000:8080
      - 127.0.0.1:3001:8081
      - 127.0.0.1:3002:8082
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/proxy.conf:/etc/nginx/persons-proxy.conf:ro
    depends_on:
      id-web:
        condition: service_healthy
      person-admin-web:
        condition: service_healthy
      person-web:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - '-q'
        - '--spider'
        - http://127.0.0.1:8082/api/health
      interval: 10s
      timeout: 5s
      retries: 15
volumes:
  properties-redis: {}
  postgres: {}
  minio: {}
