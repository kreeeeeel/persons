stages: [tooling, verify, publish, smoke, deploy]

default:
  interruptible: true
  tags: [persons-local]

variables:
  GIT_SUBMODULE_STRATEGY: none

.locked:
  before_script:
    - printf '%s' "$WORKSPACE_LOCK" > workspace.lock
    - printf '%s' "$IMAGE_MANIFEST" > images.env

.workspace:
  extends: .locked
  variables:
    GIT_STRATEGY: fetch
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_SUBMODULE_FORCE_HTTPS: 'true'
  before_script:
    - !reference [.locked, before_script]
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/".insteadOf "https://${CI_SERVER_HOST}/"
    - sh ci/workspace.sh checkout

.docker:
  image: docker:28.5.1-cli
  services:
    - name: docker:28.5.1-dind
      alias: docker
      command: ["--mtu=1360"]
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: '1'
    DOCKER_CERT_PATH: /certs/client
  before_script:
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

.tooling:
  extends: .docker
  stage: tooling
  needs: []
  script:
    - docker build --pull -f docker/ci/Dockerfile -t "$CI_TOOLING_IMAGE" .
    - docker push "$CI_TOOLING_IMAGE"

.backend:
  extends: .workspace
  stage: verify
  image: '$CI_TOOLING_IMAGE'
  variables:
    GRADLE_USER_HOME: '$CI_PROJECT_DIR/.cache/gradle'
    npm_config_cache: '$CI_PROJECT_DIR/.cache/npm'
  cache:
    key: 'gradle-$CI_JOB_NAME_SLUG'
    paths: [.cache/gradle/caches/, .cache/gradle/wrapper/, .cache/npm/]
  script:
    - sh ci/build-backend.sh
  artifacts:
    when: always
    expire_in: 2 days
    paths:
      - backend/$PROJECT/**/.build/libs/*.jar
      - backend/$PROJECT/**/docker/Dockerfile.prebuilt*
    reports:
      junit: backend/$PROJECT/**/.build/test-results/test/TEST-*.xml

.worker-backend:
  extends: .backend
  services:
    - name: postgres:18.3
      alias: worker-postgres
  variables:
    POSTGRES_DB: worker_achievements_tests
    POSTGRES_USER: tests
    POSTGRES_PASSWORD: tests
    WORKER_POSTGRES_TEST_URL: jdbc:postgresql://worker-postgres:5432/worker_achievements_tests

.dynamic-properties-backend:
  extends: .backend
  services:
    - name: redis:8.2.9-alpine
      alias: properties-test-redis
  variables:
    REDIS_TEST_HOST: properties-test-redis
    REDIS_TEST_PORT: '6379'

.clients:
  extends: .workspace
  stage: verify
  image: '$CI_TOOLING_IMAGE'
  variables:
    GRADLE_USER_HOME: '$CI_PROJECT_DIR/.cache/gradle'
    npm_config_cache: '$CI_PROJECT_DIR/.cache/npm'
  cache:
    - key: client-generator-dependencies
      paths: [.cache/gradle/caches/, .cache/gradle/wrapper/, .cache/npm/]
    - key: 'clients-$CLIENTS_KEY'
      paths:
        - backend/id/app/contract/client/typescript/.build/
        - backend/i18n/app/contract/client/typescript/.build/
        - backend/person/app/contract/client/typescript/.build/
        - backend/libs/dynamic-properties/contract/client/typescript/.build/
  script:
    - sh ci/build-clients.sh
  artifacts:
    expire_in: 2 days
    paths:
      - backend/id/app/contract/client/typescript/.build/
      - backend/i18n/app/contract/client/typescript/.build/
      - backend/person/app/contract/client/typescript/.build/
      - backend/libs/dynamic-properties/contract/client/typescript/.build/

.restrictions-backend:
  extends: .backend
  services:
    - name: postgres:18.3
      alias: restriction-db
    - name: redis:8.2.9-alpine
      alias: restriction-redis
      command: [redis-server, --requirepass, tests-cache-password, --save, '', --appendonly, 'no']
  variables:
    POSTGRES_DB: restrictions_tests
    POSTGRES_USER: tests
    POSTGRES_PASSWORD: tests
    RESTRICTIONS_POSTGRES_TEST_URL: jdbc:postgresql://restriction-db:5432/restrictions_tests
    RESTRICTIONS_REDIS_TEST_HOST: restriction-redis

.frontend:
  extends: .workspace
  stage: verify
  image: '$CI_TOOLING_IMAGE'
  variables:
    npm_config_cache: '$CI_PROJECT_DIR/.cache/npm'
    NEXT_TELEMETRY_DISABLED: '1'
  cache:
    key: 'npm-$APP'
    paths: [.cache/npm/]
  script:
    - sh ci/build-frontend.sh
  artifacts:
    expire_in: 2 days
    paths:
      - frontend/$APP/.next/standalone/
      - frontend/$APP/.next/static/
      - frontend/$APP/public/
      - frontend/$APP/docker/Dockerfile.prebuilt*

.publish:
  extends: .docker
  stage: publish
  variables:
    # Artifacts include the Dockerfile and all runtime files. Start from an empty
    # directory so deleted chunks/JARs from older jobs cannot leak into an image.
    GIT_STRATEGY: empty
  script:
    - docker build --pull -f "$DOCKERFILE" -t "$CI_REGISTRY_IMAGE/$SERVICE:$IMAGE_TAG" .
    - docker push "$CI_REGISTRY_IMAGE/$SERVICE:$IMAGE_TAG"

.publish-storage:
  extends: [.publish, .workspace]
  before_script:
    - !reference [.workspace, before_script]
    - !reference [.docker, before_script]
  script:
    # Only the smoke job may promote a storage candidate to a reusable verified tag.
    - docker build --pull -f "$DOCKERFILE" -t "$CI_REGISTRY_IMAGE/$SERVICE:$IMAGE_TAG-candidate" .
    - docker push "$CI_REGISTRY_IMAGE/$SERVICE:$IMAGE_TAG-candidate"

.storage:
  extends: .docker
  stage: smoke
  script:
    - |
      server="$CI_REGISTRY_IMAGE/minio:$MINIO_IMAGE_TAG"
      assets="$CI_REGISTRY_IMAGE/assets:$ASSETS_IMAGE_TAG"
      if [ "$MINIO_BUILT" = true ]; then server="$server-candidate"; fi
      if [ "$ASSETS_BUILT" = true ]; then assets="$assets-candidate"; fi
      docker pull "$server"
      docker pull "$assets"
      sh scripts/tests/storage.test.sh "$server" "$assets"
      if [ "$MINIO_BUILT" = true ]; then
        docker buildx imagetools create --tag "$CI_REGISTRY_IMAGE/minio:$MINIO_IMAGE_TAG" "$server"
      fi
      if [ "$ASSETS_BUILT" = true ]; then
        docker buildx imagetools create --tag "$CI_REGISTRY_IMAGE/assets:$ASSETS_IMAGE_TAG" "$assets"
      fi

.summary:
  extends: .locked
  stage: verify
  image: alpine:3.22.2
  script:
    - cat images.env
    - printf 'Source release %s; only missing verified images are built.\n' "$RELEASE_SHA"

.deploy:
  extends: [.locked, .docker]
  stage: deploy
  image: docker:28.5.1-cli
  interruptible: false
  resource_group: production
  environment:
    name: production
  rules:
    - if: '$DEPLOY_ENABLED == "true"'
      when: manual
  before_script:
    - !reference [.locked, before_script]
    - apk add --no-cache openssh-client bash coreutils python3
    - install -d -m 0700 ~/.ssh
    - install -m 0600 "$DEPLOY_SSH_KEY" ~/.ssh/id_ed25519
    - install -m 0600 "$DEPLOY_KNOWN_HOSTS" ~/.ssh/known_hosts
    - |
      case "${DEPLOY_SSH_SERVER_FIRST:-false}" in
        true)
          install -m 0700 scripts/ssh-server-first.sh ~/.ssh/persons-server-first
          printf 'Host %s\n  ConnectTimeout 35\n  ServerAliveInterval 15\n  ServerAliveCountMax 3\n  IPQoS none\n  ControlMaster auto\n  ControlPersist 60\n  ControlPath ~/.ssh/persons-%%C\n  ProxyCommand bash "%s/.ssh/persons-server-first" %%h %%p\n' "$DEPLOY_HOST" "$HOME" > ~/.ssh/config
          chmod 600 ~/.ssh/config
          ;;
        false) ;;
        *) exit 2 ;;
      esac
    - |
      if [ "${DEPLOY_TRANSFER_IMAGES:-false}" = true ]; then
        printf '%s' "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
      fi
  script:
    - sh scripts/ci-deploy.sh
